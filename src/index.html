<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <title>Rittenregistratie</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="auth-overlay" class="auth-overlay hidden">
        <div class="auth-card">
            <h1>Welkom</h1>
            <p>Log in om uw ritten te registreren.</p>
            <button id="login-btn" class="btn btn-primary">Inloggen met Microsoft</button>
        </div>
    </div>

    <div id="app" class="app-container hidden">
        <header class="app-header">
            <div class="header-content">
                <h1>Rittenregistratie</h1>
                <button id="logout-btn" class="btn-icon" aria-label="Uitloggen">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                </button>
            </div>
            <div class="connection-pill disconnected" id="connection-status">Verbinden...</div>
        </header>

        <main class="app-content">
            <!-- New Drive Form -->
            <section id="view-new-drive" class="view active">
                <form id="drive-form">
                    <div class="form-group date-group">
                        <label for="date">Datum</label>
                        <input type="date" id="date" required>
                    </div>

                    <div class="type-selector">
                        <input type="radio" name="type" id="type-business" value="Zakelijk" checked>
                        <label for="type-business" class="type-option">Zakelijk</label>
                        
                        <input type="radio" name="type" id="type-private" value="Privé">
                        <label for="type-private" class="type-option">Privé</label>
                    </div>

                    <div class="card">
                        <div class="form-group">
                            <label for="from">Van</label>
                            <input type="text" id="from" list="address-list" placeholder="Startadres" required autocomplete="off">
                        </div>
                        
                        <div class="timeline-connector"></div>

                        <div class="form-group">
                            <label for="to">Naar</label>
                            <input type="text" id="to" list="address-list" placeholder="Bestemmingsadres" required autocomplete="off">
                        </div>
                    </div>

                    <div class="card">
                        <div class="form-group">
                            <label for="description">Omschrijving (optioneel)</label>
                            <textarea id="description" rows="2" placeholder="Bijv. Project X, Klant Y"></textarea>
                        </div>
                    </div>

                    <datalist id="address-list">
                        <!-- Populated by JS -->
                    </datalist>

                    <div class="card mileage-card">
                        <div class="mileage-row">
                            <div class="mileage-info">
                                <span class="label">Vorige stand</span>
                                <span class="value" id="prev-mileage">Ophalen...</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="current-mileage">Huidige stand (km)</label>
                            <input type="number" id="current-mileage" inputmode="numeric" placeholder="000000" required>
                        </div>
                        <div class="distance-result">
                            <span class="label">Afstand</span>
                            <span class="value" id="calculated-distance">0 km</span>
                        </div>
                    </div>

                    <button type="submit" id="save-btn" class="btn btn-primary btn-block">
                        <span class="btn-text">Rit Opslaan</span>
                        <div class="loader hidden"></div>
                    </button>
                </form>
            </section>

            <!-- Drives List -->
            <section id="view-history" class="view">
                <div id="drives-list" class="drives-list">
                    <!-- Populated by JS -->
                    <div class="empty-state">Geen recente ritten gevonden.</div>
                </div>
            </section>
            <!-- Profile View -->
            <section id="view-profile" class="view">
                <div class="card profile-header">
                    <div class="profile-avatar">
                        <span id="profile-initials">?</span>
                    </div>
                    <div class="profile-info">
                        <h2 id="profile-name">Laden...</h2>
                        <p id="profile-email" class="text-muted">...</p>
                    </div>
                </div>

                <div class="card">
                    <h3>Mijn Auto</h3>
                    <form id="car-form">
                        <div class="form-group">
                            <label for="car-brand">Merk & Model</label>
                            <input type="text" id="car-brand" placeholder="bv. Tesla Model 3" required>
                        </div>
                        <div class="form-group">
                            <label for="car-license">Kenteken</label>
                            <input type="text" id="car-license" placeholder="X-999-XX" required>
                        </div>
                        <button type="submit" id="save-car-btn" class="btn btn-secondary btn-block">
                            <span class="btn-text">Auto Opslaan</span>
                        </button>
                    </form>
                </div>
            </section>
        </main>

        <nav class="bottom-nav">
            <button class="nav-item active" data-target="view-new-drive">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                <span>Nieuw</span>
            </button>
            <button class="nav-item" data-target="view-history">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                <span>Geschiedenis</span>
            </button>
            <button class="nav-item" data-target="view-profile">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span>Profiel</span>
            </button>
        </nav>
    </div>

    <script src="app.js"></script>
</body>
</html>
